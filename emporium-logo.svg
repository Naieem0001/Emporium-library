<svg id="logo-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes ring-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes ring2-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes draw {
      from { stroke-dashoffset: 400; opacity: 0; }
      to   { stroke-dashoffset: 0;   opacity: 1; }
    }
    @keyframes quill-drop {
      0%   { opacity: 0; transform: translateY(-18px); }
      60%  { opacity: 1; transform: translateY(3px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes text-rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ink-spread {
      0%   { opacity: 0; r: 0; }
      60%  { opacity: 0.6; }
      100% { opacity: 0; r: 10; }
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50%       { opacity: 1;   transform: scale(1.3); }
    }
    @keyframes shimmer {
      0%   { stroke-dashoffset: 500; opacity: 0.3; }
      50%  { opacity: 0.9; }
      100% { stroke-dashoffset: -500; opacity: 0.3; }
    }

    .ring-outer {
      transform-origin: 110px 100px;
      animation: ring-spin 18s linear infinite;
    }
    .ring-inner {
      transform-origin: 110px 100px;
      animation: ring2-spin 12s linear infinite;
    }
    .medallion-bg {
      animation: scale-in 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
      transform-origin: 110px 100px;
    }
    .outer-circle {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw 1.2s ease-out 0.3s forwards;
    }
    .inner-circle {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: draw 1s ease-out 0.5s forwards;
    }
    .mono-e {
      animation: fade-in 0.5s ease 0.8s both;
      transform-origin: 110px 100px;
    }
    .quill-group {
      animation: quill-drop 0.7s cubic-bezier(0.34,1.4,0.64,1) 1s both;
      transform-origin: 110px 100px;
    }
    .ink-drop {
      animation: ink-spread 0.6s ease-out 1.6s both;
      transform-origin: 110px 160px;
    }
    .star1 { animation: star-twinkle 2.4s ease-in-out 1.8s infinite; transform-origin: 68px 72px; }
    .star2 { animation: star-twinkle 3.1s ease-in-out 2.1s infinite; transform-origin: 152px 68px; }
    .star3 { animation: star-twinkle 2.7s ease-in-out 2.4s infinite; transform-origin: 60px 130px; }
    .star4 { animation: star-twinkle 3.4s ease-in-out 2.0s infinite; transform-origin: 158px 128px; }
    .shimmer-ring {
      stroke-dasharray: 30 470;
      animation: shimmer 3s ease-in-out 2s infinite;
      transform-origin: 110px 100px;
    }
    .wordmark {
      animation: text-rise 0.6s ease 1.4s both;
    }
    .submark {
      animation: text-rise 0.6s ease 1.65s both;
    }
    .divider {
      animation: fade-in 0.5s ease 1.55s both;
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-outer, .ring-inner, .shimmer-ring { animation: none; }
    }
  </style>

  <g class="ring-outer">
    <circle cx="110" cy="100" r="82" fill="none" stroke="#D4A030" stroke-width="0.8"
      stroke-dasharray="4 6" opacity="0.5"/>
  </g>

  <g class="ring-inner">
    <circle cx="110" cy="100" r="70" fill="none" stroke="#E8890C" stroke-width="0.5"
      stroke-dasharray="2 9" opacity="0.35"/>
  </g>

  <circle cx="110" cy="100" r="82" fill="none" stroke="#FAD87A" stroke-width="2.5"
    class="shimmer-ring" opacity="0"/>

  <circle cx="110" cy="100" r="60" fill="#1A1510" class="medallion-bg"/>

  <circle cx="110" cy="100" r="60" fill="none" stroke="#D4A030" stroke-width="1.8"
    class="outer-circle" opacity="0"/>

  <circle cx="110" cy="100" r="52" fill="none" stroke="#D4A030" stroke-width="0.6"
    class="inner-circle" opacity="0"/>

  <g opacity="0.5" style="animation: fade-in 0.5s ease 1.3s both;">
    <line x1="110" y1="42" x2="110" y2="48" stroke="#D4A030" stroke-width="1.2"/>
    <line x1="110" y1="152" x2="110" y2="158" stroke="#D4A030" stroke-width="1.2"/>
    <line x1="52" y1="100" x2="58" y2="100" stroke="#D4A030" stroke-width="1.2"/>
    <line x1="162" y1="100" x2="168" y2="100" stroke="#D4A030" stroke-width="1.2"/>
    <line x1="68" y1="57.8" x2="71.6" y2="63.1" stroke="#D4A030" stroke-width="1"/>
    <line x1="149.4" y1="136.9" x2="153" y2="142.2" stroke="#D4A030" stroke-width="1"/>
    <line x1="152" y1="57.8" x2="148.4" y2="63.1" stroke="#D4A030" stroke-width="1"/>
    <line x1="68" y1="142.2" x2="71.6" y2="136.9" stroke="#D4A030" stroke-width="1"/>
  </g>

  <g class="mono-e">
    <text x="110" y="120" text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="72" font-weight="700"
      fill="#D4A030" fill-opacity="0.08"
      stroke="#D4A030" stroke-width="1.2"
      letter-spacing="0">E</text>
  </g>

  <g class="quill-group">
    <path d="M110 62 C122 72 128 84 124 98 C120 112 112 118 110 124"
      stroke="#D4A030" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M110 62 C98 72 92 84 96 98 C100 112 108 118 110 124"
      stroke="#E8890C" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M110 62 C113 78 114 100 110 124"
      stroke="#FAD87A" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M103 80 C107 78 110 78 110 78" stroke="#D4A030" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M100 90 C105 87 110 87 110 87" stroke="#D4A030" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M99 100 C105 97 110 97 110 97" stroke="#D4A030" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M117 80 C113 78 110 78 110 78" stroke="#E8890C" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M120 90 C115 87 110 87 110 87" stroke="#E8890C" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M121 100 C115 97 110 97 110 97" stroke="#E8890C" stroke-width="0.9" fill="none" opacity="0.5"/>
    <path d="M110 124 L107 138 L110 134 L113 138 Z" fill="#D4A030"/>
  </g>

  <circle cx="110" cy="142" r="0" fill="none" stroke="#D4A030" stroke-width="1" class="ink-drop"/>

  <g class="star1">
    <polygon points="68,72 69.5,76 73.5,76 70.5,78.5 71.5,82.5 68,80 64.5,82.5 65.5,78.5 62.5,76 66.5,76"
      fill="#FAD87A" opacity="0.9" transform="scale(0.55) translate(55,56)"/>
  </g>
  <g class="star2">
    <polygon points="152,68 153.2,71.6 157,71.6 154.3,73.8 155.2,77.4 152,75.2 148.8,77.4 149.7,73.8 147,71.6 150.8,71.6"
      fill="#FAD87A" opacity="0.9" transform="scale(0.45) translate(184,84)"/>
  </g>
  <g class="star3">
    <circle cx="60" cy="130" r="2" fill="#E8890C" opacity="0.8"/>
  </g>
  <g class="star4">
    <circle cx="158" cy="128" r="1.5" fill="#FAD87A" opacity="0.8"/>
  </g>

  <g class="wordmark">
    <text x="110" y="192"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="17" font-weight="700"
      fill="#D4A030"
      letter-spacing="4">EMPORIUM</text>
  </g>

  <g class="divider">
    <line x1="52" y1="200" x2="168" y2="200" stroke="#D4A030" stroke-width="0.6" opacity="0.5"/>
    <circle cx="110" cy="200" r="2" fill="#D4A030" opacity="0.7"/>
  </g>

  <g class="submark">
    <text x="110" y="216"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="10" font-weight="400"
      fill="#C4922A"
      letter-spacing="8">LIBRARY</text>
  </g>
</svg>
