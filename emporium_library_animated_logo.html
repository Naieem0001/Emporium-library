
<style>
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    padding: 1.5rem 2rem;
    background: #0f1f35;
    border-radius: 12px;
    width: fit-content;
    margin: 0 auto 2rem;
    position: relative;
    overflow: hidden;
  }
  .logo-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(232,168,62,0.2);
    pointer-events: none;
  }

  /* BOOK SVG */
  .book-svg { overflow: visible; }

  /* Left page */
  .page-left {
    transform-origin: 50px 50%;
    animation: pageFlutterLeft 3s ease-in-out 0.5s both;
  }
  /* Right page */
  .page-right {
    transform-origin: 50px 50%;
    animation: pageFlutterRight 3s ease-in-out 0.7s both;
  }

  @keyframes pageFlutterLeft {
    0%   { transform: scaleX(1); }
    20%  { transform: scaleX(0.3) skewY(-4deg); }
    40%  { transform: scaleX(0.7) skewY(2deg); }
    60%  { transform: scaleX(0.9); }
    100% { transform: scaleX(1); }
  }
  @keyframes pageFlutterRight {
    0%   { transform: scaleX(1); }
    20%  { transform: scaleX(0.4) skewY(4deg); }
    40%  { transform: scaleX(0.8) skewY(-2deg); }
    60%  { transform: scaleX(0.95); }
    100% { transform: scaleX(1); }
  }

  /* Quill */
  .quill {
    opacity: 0;
    animation: quillAppear 0.6s ease-out 0.2s forwards;
    transform-origin: 50% 100%;
  }
  @keyframes quillAppear {
    0%   { opacity: 0; transform: translateY(8px) rotate(-15deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  /* Ink lines on pages */
  .ink-line {
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
  }
  .ink-line:nth-child(1) { animation: inkWrite 0.4s ease-out 1.0s forwards; }
  .ink-line:nth-child(2) { animation: inkWrite 0.4s ease-out 1.2s forwards; }
  .ink-line:nth-child(3) { animation: inkWrite 0.4s ease-out 1.4s forwards; }
  .ink-line:nth-child(4) { animation: inkWrite 0.4s ease-out 1.1s forwards; }
  .ink-line:nth-child(5) { animation: inkWrite 0.4s ease-out 1.3s forwards; }
  .ink-line:nth-child(6) { animation: inkWrite 0.4s ease-out 1.5s forwards; }
  @keyframes inkWrite {
    to { stroke-dashoffset: 0; }
  }

  /* Spine glow */
  .spine {
    animation: spineGlow 2s ease-in-out 0.3s both;
  }
  @keyframes spineGlow {
    0%   { opacity: 0; stroke-width: 3; }
    40%  { opacity: 1; stroke-width: 2.5; }
    100% { opacity: 1; stroke-width: 2; }
  }

  /* Star particles */
  .star { opacity: 0; }
  .star:nth-child(1) { animation: starPop 0.5s ease-out 0.8s both; }
  .star:nth-child(2) { animation: starPop 0.5s ease-out 1.0s both; }
  .star:nth-child(3) { animation: starPop 0.5s ease-out 0.9s both; }
  @keyframes starPop {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0.7; transform: scale(1); }
  }

  /* === WORDMARK === */
  .wordmark { overflow: visible; }

  /* EMPORIUM: each letter slides + fades */
  .em-letter {
    opacity: 0;
    animation: letterReveal 0.05s ease-out both;
  }
  .em-letter:nth-child(1)  { animation-delay: 0.6s; }
  .em-letter:nth-child(2)  { animation-delay: 0.68s; }
  .em-letter:nth-child(3)  { animation-delay: 0.76s; }
  .em-letter:nth-child(4)  { animation-delay: 0.84s; }
  .em-letter:nth-child(5)  { animation-delay: 0.92s; }
  .em-letter:nth-child(6)  { animation-delay: 1.0s; }
  .em-letter:nth-child(7)  { animation-delay: 1.08s; }
  .em-letter:nth-child(8)  { animation-delay: 1.16s; }
  @keyframes letterReveal {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Gold underline draws in */
  .gold-line {
    stroke-dasharray: 110;
    stroke-dashoffset: 110;
    animation: lineDraw 0.6s ease-out 1.5s forwards;
  }
  @keyframes lineDraw {
    to { stroke-dashoffset: 0; }
  }

  /* LIBRARY text fades up */
  .library-text {
    opacity: 0;
    animation: libraryRise 0.5s ease-out 1.7s forwards;
  }
  @keyframes libraryRise {
    0%   { opacity: 0; transform: translateY(5px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Divider */
  .divider {
    opacity: 0;
    animation: fadeIn 0.4s ease-out 1.6s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Hover effect on entire logo */
  .logo-wrap:hover .book-svg {
    filter: drop-shadow(0 0 6px rgba(232,168,62,0.5));
    transition: filter 0.3s;
  }
  .logo-wrap:hover .em-letter {
    fill: #f0c060;
    transition: fill 0.3s;
  }

  /* === DEMO VARIANTS BELOW === */
  .demo-section {
    padding: 1rem 0;
    text-align: center;
  }
  .demo-label {
    font-size: 11px;
    color: var(--color-text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    font-family: sans-serif;
  }
  .size-demos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    padding: 1rem;
    background: #0f1f35;
    border-radius: 10px;
    margin-top: 1rem;
  }

  /* Navbar-size version */
  .logo-sm { transform: scale(0.55); transform-origin: left center; }
  .logo-md { transform: scale(0.75); transform-origin: center center; }
</style>
